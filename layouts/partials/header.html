{{- $page := . -}}
<header class="masthead">
  <div class="masthead-inner">
    <a class="wordmark" href="{{ "/" | relURL }}">
      <span class="wordmark-name">TermMosaic</span>
      <span class="wordmark-tag">pre-alpha</span>
    </a>
    <nav class="topnav" aria-label="Sections">
      <ul>
        {{ range site.Menus.main }}
          {{ if not .HasChildren }}
            <li><a href="{{ .URL }}"{{ if $page.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
          {{ end }}
        {{ end }}
      </ul>
    </nav>
    <form class="search" action="{{ "search/" | relURL }}" method="get" role="search">
      <label class="visually-hidden" for="q">Search the documentation</label>
      <input id="q" type="search" name="q" placeholder="Search…" autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </div>
  <p class="alpha-bar">
    <strong>Pre-alpha.</strong> The API is not stable and will break without notice until v1.0.0.
    Read the <a href="{{ "/limitations/" | relURL }}">limitations</a> before you rely on anything here.
  </p>
</header>
