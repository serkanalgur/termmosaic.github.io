{{ define "main" }}

  <h1>No page here</h1>

  <ul>
    <li><a href="{{ site.Home.RelPermalink }}">Start page</a></li>
    <li><a href="{{ "/widgets/" | absURL }}">The 22-widget catalog</a></li>
    <li><a href="{{ "/getting-started/quickstart/" | absURL }}">Quickstart</a></li>
    <li><a href="{{ site.Params.godoc }}" rel="noopener">pkg.go.dev</a> — the API reference is never out of date</li>
  </ul>
</article>
{{ end }}
