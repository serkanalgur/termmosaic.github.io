<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="tm-site">
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <div class="wrap">
    {{ partial "sidebar.html" . }}
    <main id="main" tabindex="-1">
      {{ block "main" . }}{{ end }}
    </main>
  </div>
  {{ partial "footer.html" . }}
</body>
</html>
