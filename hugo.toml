# TermMosaic documentation site.
#
# The capture artefacts under static/captures/ are generated by the framework
# repo (cmd/capture) and are committed here untouched. Do not hand-edit them and
# do not regenerate them from this repo — see README.md.

baseURL = "https://serkanalgur.github.io/termmosaic.github.io/"
locale = "en-gb"
title = "TermMosaic"
enableRobotsTXT = true
enableEmoji = false
# Content is Markdown we write; the shortcodes emit the only raw HTML on the
# site. Leaving Goldmark's unsafe renderer off means a stray < in a code sample
# cannot become markup.
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 200

[params]
  description = "Documentation for TermMosaic: a terminal UI framework for Go. A cell-buffer renderer and 24 widgets, at v1.0.0."
  repo = "https://github.com/serkanalgur/termmosaic"
  repoBranch = "main"
  godoc = "https://pkg.go.dev/github.com/serkanalgur/termmosaic"
  # Stated in the footer of every page, per docs/SITE-PLAN.md §3.2.
  #
  # v1.0.0 (2026-10-06) is the first release that makes a stability promise:
  # the public API freezes there and Semantic Versioning applies in earnest.
  # The framework's own README and docs/STATUS.md still open with a
  # pre-alpha / "will break before v1.0" block written before that release;
  # the release notes and CHANGELOG are the more recent statement, so the
  # site follows them.
  stability = "v1.0.0 — the first release that makes a stability promise: the public API freezes here and Semantic Versioning applies in earnest"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
      wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.parser.attribute]
      block = true
      title = true
  [markup.highlight]
    # Classes, not inline styles: Chroma's palette is defined in site.css so the
    # capture theme and the code theme can be tuned together and respect
    # prefers-color-scheme.
    noClasses = false
    lineNos = false
    tabWidth = 4
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]

[services.rss]
  limit = 20

[minify]
  disableHTML = true

