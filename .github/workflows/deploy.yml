name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-go@v5
        with:
          # Pinned deliberately: raising this floor is what would unpin
          # golang.org/x/term in the framework repo. See
          # github.com/serkanalgur/termmosaic docs/adr/0001-backend-strategy.md
          go-version: "1.23"

      # A content change must not silently break the build. Both checkers are
      # pure-Python and need no Hugo, so they run before the expensive step.
      - name: Install docs check dependencies
        run: pip install --quiet PyYAML

      # These three need no Hugo and run first, so a content mistake is
      # reported in seconds rather than after a full site build.
      - name: Validate front matter
        run: python3 scripts/check_frontmatter.py

      - name: Verify captures are untouched
        run: bash scripts/check_captures.sh

      # Hugo is installed and invoked explicitly rather than through an action
      # wrapper. The wrapper accepts no `minify` input and hid the build's own
      # output, so a failing build reported nothing but a later missing
      # directory. Running hugo directly surfaces its errors and pins the
      # destination this workflow expects.
      - name: Install Hugo (extended)
        run: |
          set -euo pipefail
          version=0.167.0
          url="https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_extended_${version}_linux-amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/hugo.tgz
          tar -xzf /tmp/hugo.tgz -C /usr/local/bin hugo
          hugo version

      - name: Build
        run: hugo --gc --minify --destination public
        env:
          HUGO_ENVIRONMENT: production

      # Pagefind indexes the BUILT html, so it must run after Hugo. Without
      # this step the search UI ships, pagefind.js is requested, and every
      # request 404s: search fails silently on a live site, which is exactly
      # what it was doing before this step existed.
      - name: Build the Pagefind search index
        run: |
          set -euo pipefail
          version=1.5.2
          # Verified against the release API: there is no -gnu build, only -musl.
          # A constructed asset name 404s at run time and the whole step fails
          # with curl's exit 22, which says nothing useful.
          asset="pagefind-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "https://github.com/CloudCannon/pagefind/releases/download/v${version}/${asset}" -o /tmp/pagefind.tgz
          mkdir -p /tmp/pagefind && tar -xzf /tmp/pagefind.tgz -C /tmp/pagefind
          /tmp/pagefind/pagefind --site public
          test -f public/pagefind/pagefind.js

      # check_links.py resolves internal links against the BUILT output, so it
      # must come after Hugo. Running it earlier fails with "no build output"
      # and says nothing about the content.
      - name: Check internal links
        run: python3 scripts/check_links.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4